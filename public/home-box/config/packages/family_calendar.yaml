# Family Smart Calendar — voice commands for Home Assistant (2024.10 or newer).
# Save as /config/packages/family_calendar.yaml, put your voice key in /config/secrets.yaml as
#   family_voice_token: fam_...
# and make sure configuration.yaml has:
#   homeassistant:
#     packages: !include_dir_named packages
# Then restart Home Assistant. Each sentence below calls the family calendar and says its answer.

rest_command:
  family_voice:
    url: https://kmuryknypcnhludyjaoi.supabase.co/functions/v1/voice
    method: POST
    content_type: application/json
    headers:
      x-voice-token: !secret family_voice_token
    payload: "{{ payload | tojson }}"
    timeout: 15

  family_home_event:
    url: https://kmuryknypcnhludyjaoi.supabase.co/functions/v1/pair-home-box
    method: POST
    content_type: application/json
    headers:
      x-voice-token: !secret family_voice_token
    payload: "{{ payload | tojson }}"
    timeout: 10

automation:
  # Doorbell → pop up on the wall with the camera picture (and a phone notification for a ring).
  # A ring: any "event" entity whose event type is ring/press/ding, or a "ringing" sensor turning on.
  # Someone at the door: a person detected by the doorbell itself (devices named "...door..." or Eufy doorbells, model T82…).
  - id: family_doorbell
    alias: "Family: doorbell to the wall"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {% set e = trigger.event.data.entity_id %}
          {% set n = trigger.event.data.new_state %}
          {% set o = trigger.event.data.old_state %}
          {% if n is none or o is none or n.state in ['unavailable', 'unknown'] or n.state == o.state %}false
          {% else %}
            {% set t = (n.attributes.event_type | default('') | string | lower) %}
            {% set did = device_id(e) %}
            {% set dname = ((device_attr(did, 'name_by_user') or device_attr(did, 'name') or '') | lower) if did else '' %}
            {% set model = ((device_attr(did, 'model') or '') | string) if did else '' %}
            {% set at_door = 'door' in dname or 'bell' in dname or model.startswith('T82') %}
            {% if e.startswith('event.') and t is search('ring|press|ding|doorbell') %}true
            {% elif e.startswith('binary_sensor.') and e is search('ring|ding') and n.state == 'on' %}true
            {% elif e.startswith('event.') and t == 'person' and at_door %}true
            {% else %}false{% endif %}
          {% endif %}
    actions:
      - variables:
          rang: >-
            {% set t = (trigger.event.data.new_state.attributes.event_type | default('') | string | lower) %}
            {{ trigger.event.data.entity_id.startswith('binary_sensor.') or t is search('ring|press|ding|doorbell') }}
          did: "{{ device_id(trigger.event.data.entity_id) }}"
          cam: >-
            {% set mine = (device_entities(did) | select('match', 'camera[.]') | list) if did else [] %}
            {{ mine[0] if mine else (states.camera | map(attribute='entity_id') | select('search', 'door|front|bell') | first | default('')) }}
          pic: >-
            {% set imgs = (device_entities(did) | select('match', 'image[.]') | list) if did else [] %}
            {{ state_attr(cam, 'entity_picture') if cam and state_attr(cam, 'entity_picture') else (state_attr(imgs[0], 'entity_picture') if imgs else '') }}
          where: "{{ (device_attr(did, 'name_by_user') or device_attr(did, 'name') or 'Front door') if did else 'Front door' }}"
      - action: rest_command.family_home_event
        data:
          payload:
            event:
              kind: "{{ 'doorbell' if rang else 'person' }}"
              title: "{{ \"Someone's at the door\" if rang else 'Someone at the ' ~ (where if not where.startswith('T82') else 'front door') }}"
              camera: "{{ where if not where.startswith('T82') else 'Front door' }}"
              image: "{{ pic }}"
      - delay: "00:00:20"

  - id: family_voice_plan_meal
    alias: "Family voice: add to the weekly menu"
    triggers:
      - trigger: conversation
        command:
          - "(add|put|plan|have) {dish} for (breakfast|lunch|dinner|tea|supper) [on|for] [today|tonight|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday]"
          - "(add|put|plan) {dish} (on|to) [the] [weekly] menu [for] [{when}]"
          - "(add|put|plan) {dish} (on|to|for) (monday|tuesday|wednesday|thursday|friday|saturday|sunday|today|tomorrow) [for] [breakfast|lunch|dinner|tea|supper]"
    actions:
      - action: rest_command.family_voice
        data:
          payload:
            text: "{{ trigger.sentence }}"
        response_variable: result
      - set_conversation_response: "{{ result.content.speech if result.content is mapping else 'Sorry, I could not reach the family calendar.' }}"

  - id: family_voice_meal
    alias: "Family voice: what's for dinner"
    triggers:
      - trigger: conversation
        command:
          - "(what's|whats|what is) for (breakfast|lunch|dinner|tea|supper) [today|tonight|tomorrow]"
          - "what are we (having|eating) [for] [breakfast|lunch|dinner|tea|supper] [today|tonight|tomorrow]"
          - "(what's|whats|what is) on the menu [today|tonight|tomorrow]"
    actions:
      - action: rest_command.family_voice
        data:
          payload:
            text: "{{ trigger.sentence }}"
        response_variable: result
      - set_conversation_response: "{{ result.content.speech if result.content is mapping else 'Sorry, I could not reach the family calendar.' }}"

  - id: family_voice_whats_on
    alias: "Family voice: what's on"
    triggers:
      - trigger: conversation
        command:
          - "(what's|whats|what is) (on|happening) [today|tonight|tomorrow]"
          - "(what's|whats|what is) (on|happening) [on] (monday|tuesday|wednesday|thursday|friday|saturday|sunday)"
          - "what are we doing [today|tomorrow|this weekend]"
          - "(what's|whats|what is) on for {who} [today|tomorrow]"
          - "(what's|whats|what is) {who} doing [today|tomorrow]"
          - "(what's|whats|what is) the plan [for] [today|tomorrow]"
    actions:
      - action: rest_command.family_voice
        data:
          payload:
            intent: whats_on
            heard: "{{ trigger.sentence }}"
            who: "{{ trigger.slots.who | default('') }}"
        response_variable: result
      - set_conversation_response: "{{ result.content.speech if result.content is mapping else 'Sorry, I could not reach the family calendar.' }}"

  - id: family_voice_remind
    alias: "Family voice: reminders"
    triggers:
      - trigger: conversation
        command:
          - "remind {who} (at|in) {time} to {what}"
          - "remind {who} (tomorrow|tonight|this evening|in the morning) [at] {time} to {what}"
          - "remind {who} to {what} (at|in) {time}"
          - "remind {who} to {what} (tomorrow|tonight) [at] {time}"
    actions:
      - action: rest_command.family_voice
        data:
          payload:
            intent: remind
            heard: "{{ trigger.sentence }}"
            who: "{{ trigger.slots.who }}"
            what: "{{ trigger.slots.what }}"
            when: "{{ (trigger.sentence | lower).replace(trigger.slots.what | lower, '') }}"
        response_variable: result
      - set_conversation_response: "{{ result.content.speech if result.content is mapping else 'Sorry, I could not reach the family calendar.' }}"

  - id: family_voice_task_done
    alias: "Family voice: tick a task"
    triggers:
      - trigger: conversation
        command:
          - "{who} [has] (did|done|finished|completed) {task}"
          - "{who} [has] (brushed|made|tidied|packed|cleaned|fed|read|got|put|emptied|washed|set|cleared|took|practised|practiced|watered|walked|hoovered|folded|unloaded|loaded|wiped|changed|had) {task}"
          - "tick [off] {task} for {who}"
          - "mark {task} [as] done for {who}"
    actions:
      - action: rest_command.family_voice
        data:
          payload:
            intent: task_done
            heard: "{{ trigger.sentence }}"
            who: "{{ trigger.slots.who }}"
            task: "{{ trigger.slots.task }}"
        response_variable: result
      - set_conversation_response: "{{ result.content.speech if result.content is mapping else 'Sorry, I could not reach the family calendar.' }}"

  - id: family_voice_stars
    alias: "Family voice: stars"
    triggers:
      - trigger: conversation
        command:
          - "how many stars (does|has) {who} [got|have]"
          - "how many stars [have] {who} got"
    actions:
      - action: rest_command.family_voice
        data:
          payload:
            intent: stars
            heard: "{{ trigger.sentence }}"
            who: "{{ trigger.slots.who }}"
        response_variable: result
      - set_conversation_response: "{{ result.content.speech if result.content is mapping else 'Sorry, I could not reach the family calendar.' }}"
